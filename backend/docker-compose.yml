# Local dev stack: Postgres + the API.
#   docker compose up --build
# The API waits for a healthy DB, runs migrations, seeds demo data, then serves
# on http://localhost:8000  (docs at /docs).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: franchiseguard
      POSTGRES_PASSWORD: franchiseguard
      POSTGRES_DB: franchiseguard
    ports:
      - "5432:5432"
    volumes:
      - fg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franchiseguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://franchiseguard:franchiseguard@db:5432/franchiseguard
      SECRET_KEY: dev-only-secret-change-me-0123456789abcdef
      ENVIRONMENT: local
      DEBUG: "true"
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,https://staging.rocketride.ai"
      AI_PROVIDER: simulated
      RUN_MIGRATIONS: "1"
      SEED_ON_START: "1"
      FIRST_ADMIN_EMAIL: admin@franchiseguard.ai
      FIRST_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8000:8000"

volumes:
  fg_pgdata:
